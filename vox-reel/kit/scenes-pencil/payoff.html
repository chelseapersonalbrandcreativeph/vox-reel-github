      <div id="p-l1" class="k-caps"><span>the</span><span>pencil</span><span>wasn’t</span><span>better.</span></div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const words = (sel, t0, gap) =>
      gsap.utils.toArray(sel).forEach((el, i) => {
        tl.fromTo(el, { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.14, ease: "back.out(2)" }, t0 + i * gap);
      });

    // the stack re-centres as it grows
    tl.fromTo("#p-stack", { y: 300 }, { y: 170, duration: 0.2, ease: "power3.out" }, 0.85);
    tl.fromTo("#p-stack", { y: 170 }, { y: 0, duration: 0.2, ease: "power3.out", immediateRender: false }, 1.3);

    words("#p-l1 span", 0.05, 0.11);
    words("#p-l2 span", 0.9, 0.14);
    words("#p-l3 > span", 1.3, 0.14);
    tl.fromTo("#p-hl", { scaleX: 0 }, { scaleX: 1, duration: 0.24, ease: "power3.out" }, 1.62);
    words("#p-l4 span", 1.95, 0.14);

    // sign-off: the pencil rolls in, the sticker slaps on top
    tl.fromTo("#p-pencil", { x: -1100, rotation: -4 },
      { x: 0, rotation: -4, duration: 0.5, ease: VOX.twos("power3.out", 0.5) }, 2.45);
    tl.fromTo("#p-tag", { opacity: 0, scale: 1.6, rotation: -16 },
      { opacity: 1, scale: 1, rotation: -5, duration: 0.28, ease: "back.out(1.8)" }, 2.75);

    window.__timelines["payoff"] = tl;
