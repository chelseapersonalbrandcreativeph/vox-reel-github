    <meta charset="UTF-8" />

    <style>
      /* ---- vox-kit: brand tokens shared by every scene ---- */
      :root {
        --paper: #f5f2eb;
        --grid-paper: #e8e6e0;
        --grid-line: #cfccc3;
        --night: #141414;
        --night-line: #2a2a2a;
        --ink: #262626;
        --chalk: #f2f2f2;
        --vox-yellow: #ffe81f;
        --pill-red: #d3242b;
        --cyan: #33c6f2;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        width: 100%;
        height: 100%;
      }
      /* type roles */
      .k-caps {
        font-family: "Montserrat", sans-serif;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .k-hero {
        font-family: "Archivo Black", sans-serif;
        letter-spacing: -0.01em;
        text-transform: uppercase;
      }
      .k-serif-i {
        font-family: "Playfair Display", serif;
        font-weight: 900;
        font-style: italic;
      }
      .k-serif {
        font-family: "Playfair Display", serif;
        font-weight: 900;
      }
      /* grounds */
      .g-paper {
        background: var(--paper);
      }
      .g-grid {
        background-color: var(--grid-paper);
        background-image:
          linear-gradient(var(--grid-line) 1.5px, transparent 1.5px),
          linear-gradient(90deg, var(--grid-line) 1.5px, transparent 1.5px);
        background-size: 40px 40px;
        background-position: -1px -1px;
      }
      .g-night {
        background-color: var(--night);
        background-image:
          linear-gradient(var(--night-line) 3px, transparent 3px),
          linear-gradient(90deg, var(--night-line) 3px, transparent 3px);
        background-size: 108px 108px;
        background-position: -2px -2px;
      }
      /* yellow torn-edge sticker tag */
      .sticker {
        display: inline-block;
        background: var(--vox-yellow);
        color: var(--ink);
        padding: 6px 34px 14px;
        clip-path: polygon(1% 5%, 13% 0%, 31% 3%, 52% 0, 74% 2%, 99% 0, 100% 31%, 98% 63%, 100% 97%, 81% 100%, 56% 96%, 31% 100%, 8% 97%, 0 100%, 2% 66%, 0 34%);
      }
      /* red say-it-out-loud caption pill */
      .pill {
        display: inline-block;
        background: var(--pill-red);
        color: #fff;
        font-family: "Oswald", sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 44px;
        line-height: 1;
        padding: 12px 28px 14px;
        border-radius: 999px;
        white-space: nowrap;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.18);
      }
      /* halftone + outline serif (inactive words) */
      .halftone {
        color: transparent;
        background-image: radial-gradient(circle, #6e6e6e 1.7px, transparent 2.1px);
        background-size: 7px 7px;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-stroke: 2.5px #5d5d5d;
      }
      /* the real pencil, masked out of its photo */
      .pencil {
        background: url("assets/img/pencil-band.jpg") center / 100% 100% no-repeat;
        aspect-ratio: 3480 / 280;
        clip-path: polygon(0.6% 60%, 10.7% 37%, 92.3% 15.7%, 93.2% 10%, 99.4% 8.6%, 99.6% 54.3%, 93.2% 68%, 92.3% 68.6%, 10.3% 88.6%);
      }
      /* small red play badge that pops onto stickers */
      .play-badge {
        width: 96px;
        height: 68px;
        border-radius: 18px;
        background: var(--pill-red);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.18);
      }
      .play-badge::after {
        content: "";
        border-left: 30px solid #fff;
        border-top: 18px solid transparent;
        border-bottom: 18px solid transparent;
        margin-left: 6px;
      }
      #grain {
        position: absolute;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        background-image: url("assets/img/grain.png");
        background-size: 512px 512px;
        mix-blend-mode: soft-light;
        opacity: 0.32;
      }

    <script>
      // vox-kit helpers, shared by every scene's timeline
      window.VOX = {
        W: 1080,
        H: 1920,
        // stop-motion feel: quantise an ease to 15 steps a second ("on twos" at 30 fps)
        twos(base, dur) {
          const e = gsap.parseEase(base || "power2.out");
          const n = Math.max(1, Math.round(dur * 15));
          return (p) => e(Math.round(p * n) / n);
        },
        // page peel from the top-right corner. content = element that is clipped away,
        // flap = full-frame element showing the back of the page.
        peel(tl, content, flap, at, dur) {
          const W = 1080,
            H = 1920;
          const rect = [
            [0, 0],
            [W, 0],
            [W, H],
            [0, H],
          ];
          // half-plane clip: keep points where side(p) >= 0
          const clip = (poly, side) => {
            const out = [];
            for (let i = 0; i < poly.length; i++) {
              const a = poly[i],
                b = poly[(i + 1) % poly.length];
              const sa = side(a),
                sb = side(b);
              if (sa >= 0) out.push(a);
              if (sa >= 0 !== sb >= 0) {
                const t = sa / (sa - sb);
                out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
              }
            }
            return out;
          };
          const css = (poly) =>
            poly.length < 3
              ? "polygon(0 0,0 0,0 0)"
              : "polygon(" + poly.map((p) => p[0].toFixed(1) + "px " + p[1].toFixed(1) + "px").join(",") + ")";
          const c = document.querySelector(content),
            f = document.querySelector(flap);
          const apply = (k) => {
            // fold line: y = x * 0.62 + k  (a slightly steep diagonal, like a real corner lift)
            const m = 0.62;
            const keep = clip(rect, (p) => p[1] - m * p[0] - k);
            const gone = clip(rect, (p) => -(p[1] - m * p[0] - k));
            // reflect the removed part across the fold line onto the page
            const d = 1 + m * m;
            const refl = gone.map(([x, y]) => {
              const t = (y - m * x - k) / d;
              return [x + 2 * m * t, y - 2 * t];
            });
            c.style.clipPath = css(keep);
            f.style.clipPath = css(refl);
          };
          const o = { k: -m0() };
          function m0() {
            return 0.62 * 1080 + 10;
          }
          apply(o.k);
          tl.fromTo(
            o,
            { k: -m0() },
            { k: H + 40, duration: dur, ease: "power2.in", onUpdate: () => apply(o.k) },
            at,
          );
        },
      };
    </script>
