<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    #h-bg {
      position: absolute;
      inset: 0;
    }
    #h-stack {
      position: absolute;
      left: 0;
      right: 0;
      top: 470px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #h-kick {
      font-size: 60px;
      color: var(--ink);
      display: flex;
      gap: 0.45em;
    }
    #h-tagwrap {
      position: relative;
      margin-top: 40px;
    }
    #h-tag {
      font-size: 168px;
      line-height: 1;
    }
    #h-badge {
      position: absolute;
      right: -30px;
      top: -40px;
    }
    #h-vid {
      font-size: 220px;
      line-height: 1.05;
      color: var(--ink);
      margin-top: 18px;
      display: flex;
    }
    #h-vid span {
      display: inline-block;
    }
    #h-under {
      width: 780px;
      height: 70px;
      margin-top: -14px;
      overflow: visible;
    }
    #h-pill-wrap {
      margin-top: 56px;
    }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <div id="h-bg" class="g-paper"></div>
    <div id="h-stack">
      <div id="h-kick" class="k-caps"><span>have</span><span>you</span><span id="h-w3">seen</span><span id="h-w4">those</span></div>
      <div id="h-tagwrap">
        <div id="h-tag" class="sticker k-serif">Vox-style</div>
        <div id="h-badge" class="play-badge"></div>
      </div>
      <div id="h-vid" class="k-serif-i">
        <span>v</span><span>i</span><span>d</span><span>e</span><span>o</span><span>s</span><span>?</span>
      </div>
      <svg id="h-under" viewBox="0 0 780 70">
        <path id="h-under-path" d="M18 40 C 170 22, 430 18, 762 30 M70 56 C 270 44, 480 46, 650 52"
          fill="none" stroke="#FFE81F" stroke-width="16" stroke-linecap="round" />
      </svg>
      <div id="h-pill-wrap"><span id="h-pill" class="pill">(you know the ones)</span></div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const on = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t);

    // the stack re-centres as each line lands
    tl.fromTo("#h-stack", { y: 380 }, { y: 250, duration: 0.2, ease: "power3.out" }, 0.55);
    tl.fromTo("#h-stack", { y: 250 }, { y: 70, duration: 0.2, ease: "power3.out", immediateRender: false }, 1.2);
    tl.fromTo("#h-stack", { y: 70 }, { y: 0, duration: 0.2, ease: "power3.out", immediateRender: false }, 2.55);

    // frame 0 reads "HAVE YOU"; the rest of the line lands word by word
    on("#h-w3", 0.15);
    on("#h-w4", 0.32);

    // sticker slaps on, play badge pops after it
    tl.fromTo("#h-tag", { opacity: 0, scale: 1.6, rotation: -14 },
      { opacity: 1, scale: 1, rotation: -4, duration: 0.28, ease: "back.out(1.8)" }, 0.55);
    tl.fromTo("#h-tagwrap", { x: 0 }, { x: 4, duration: 0.067, ease: "steps(1)", yoyo: true, repeat: 1 }, 0.83);
    tl.fromTo("#h-badge", { opacity: 0, scale: 0.3, rotation: -20 },
      { opacity: 1, scale: 1, rotation: 8, duration: 0.2, ease: "back.out(2.6)" }, 0.78);

    // "videos?" letter by letter
    gsap.utils.toArray("#h-vid span").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.12, ease: "back.out(2)" }, 1.2 + i * 0.045);
    });

    // felt-marker underline
    const p = document.querySelector("#h-under-path");
    const len = p.getTotalLength();
    tl.fromTo(p, { strokeDasharray: len, strokeDashoffset: len, opacity: 0 },
      { strokeDashoffset: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 1.8);

    tl.fromTo("#h-pill", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.14, ease: "back.out(2.2)" }, 2.6);

    window.__timelines["hook"] = tl;
  </script>
</template>
