        <div id="b-kick" class="k-caps"><span id="b-k1">you</span><span id="b-k2">don’t</span><span id="b-k3">need</span></div>

          <svg class="b-strike" viewBox="0 0 600 100" preserveAspectRatio="none"><path id="b-s1" d="M10 70 C 160 30, 380 22, 590 40" fill="none" stroke="#D3242B" stroke-width="18" stroke-linecap="round" /></svg>

  <script>
    const tl = gsap.timeline({ paused: true });
    const on = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t);
    const draw = (sel, t) => {
      const p = document.querySelector(sel);
      const len = p.getTotalLength();
      tl.fromTo(p, { strokeDasharray: len, strokeDashoffset: len, opacity: 0 },
        { strokeDashoffset: 0, opacity: 1, duration: 0.32, ease: "power2.out" }, t);
    };

    // cut in with the question already on screen; the answer builds word by word
    on("#b-k1", 0.75);
    on("#b-k2", 0.88);
    on("#b-k3", 1.01);

    tl.fromTo("#b-t1", { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.16, ease: "back.out(2)" }, 1.3);
    draw("#b-s1", 1.75);
    on("#b-or", 2.05);
    tl.fromTo("#b-t2", { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.16, ease: "back.out(2)" }, 2.25);
    draw("#b-s2", 2.7);
    // crossed-out tools fade back so the strike is what you read
    tl.fromTo(["#b-t1", "#b-t2"], { color: "#f2f2f2" }, { color: "#6a6a6a", duration: 0.2, ease: "power2.out", immediateRender: false }, 3.0);

    tl.fromTo("#b-pill", { opacity: 0, scale: 0.8, rotation: 0 },
      { opacity: 1, scale: 1, rotation: -3, duration: 0.14, ease: "back.out(2.2)" }, 3.15);

    VOX.peel(tl, "#b-page", "#b-flap", 4.0, 0.58);

    window.__timelines["best"] = tl;
