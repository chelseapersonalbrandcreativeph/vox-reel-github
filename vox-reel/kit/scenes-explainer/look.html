  <div id="root" data-composition-id="look" data-width="1080" data-height="1920">

    <div id="l1" class="l-card"><img id="l1-img" src="assets/img/shot-2.8.jpg" alt="hook frame" /></div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const rots = [-5, 4, 3, -4];

    // the frames are slapped down like prints on a table
    ["#l1", "#l2", "#l3", "#l4"].forEach((c, i) => {
      tl.fromTo(c, { opacity: 0, scale: 1.35, rotation: rots[i] * 3 },
        { opacity: 1, scale: 1, rotation: rots[i], duration: 0.26, ease: "back.out(1.6)" }, 0.08 + i * 0.22);
      // stills feel like footage: slow constant push
      tl.fromTo(c + "-img", { scale: 1 }, { scale: 1.08, duration: 4.4, ease: "none" }, 0);
    });

    // pills, centred on their anchor
    [["#lp1", 0.45, 1.5], ["#lp2", 1.5, 2.55], ["#lp3", 2.55, null]].forEach(([s, t0, t1], i) => {
      gsap.set(s, { xPercent: -50, yPercent: -50 });
      tl.fromTo(s, { opacity: 0, scale: 0.8, rotation: 0 },
        { opacity: 1, scale: 1, rotation: i === 2 ? -4 : 0, duration: i === 2 ? 0.22 : 0.14, ease: "back.out(2.2)" }, t0);
      if (t1) tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: 0.01, immediateRender: false }, t1);
    });

    window.__timelines["look"] = tl;
  </script>
